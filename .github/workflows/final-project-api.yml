name: API Tests

on:
  push:
    branches: [ main, master, finalproject ]
    paths:
      - 'Final Course Project/**'
      - '.github/workflows/final-project-api.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Final Course Project/**'
      - '.github/workflows/final-project-api.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: "Final Course Project"

jobs:
  api-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    
    - name: Create .env file
      run: |
        echo "BASE_URL=${{ secrets.BASE_URL }}" > .env
        echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> .env
        echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> .env
    
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run API tests
      run: npm run test:api
    - name: Generate Allure Report
      if: always()
      run: npm run report:generate
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report-api
        path: "Final Course Project/allure-report/"
        retention-days: 30